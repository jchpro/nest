name: Runs checks, tests and builds the libraries
on:
  pull_request

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check versions
        run: npm run check:versions
      # Builds the libraries first (mongoose resolves common from its dist/)
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Packs the libraries and checks the tarballs in a clean temporary project
      - name: Verify the packages
        run: npm run verify:libs
      # Only what consumers install; advisories in dev tooling don't block anything
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
