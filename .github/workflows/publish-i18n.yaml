name: Publish @jchpro/nest-i18n to NPM

# Publishes with OIDC trusted publishing: no NPM_TOKEN involved, npm exchanges this workflow's GitHub-issued
# OIDC token for a short-lived publish token. The trusted publisher (repo jchpro/nest, workflow file
# publish-i18n.yaml) is configured on npmjs.com for the package. Provenance is attached automatically
# (public repo), so there is no --provenance flag.
#
# Runs only on a `i18n-vX.Y.Z` tag, created by `npm run release -- tag i18n` after the release PR
# merged. To retry a failed publish, re-run the job from the Actions tab (a workflow_dispatch trigger would
# let a branch publish without a tag).
on:
  push:
    tags:
      - 'i18n-v*'

permissions:
  contents: read
  id-token: write # required for npm's OIDC trusted publishing

jobs:
  publish:
    name: Test, build and publish @jchpro/nest-i18n
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # npm >= 11.5.1 is required for OIDC trusted publishing, and actions/setup-node doesn't guarantee it
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Check the tag against package.json, the changelog and the peer ranges
        run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"
      - name: Build the libraries
        run: npm run build:libs
      - name: Test @jchpro/nest-i18n
        run: npx vitest run libs/i18n
      - name: Verify the packages
        run: npm run verify:libs
      - name: Publish @jchpro/nest-i18n
        working-directory: ./libs/i18n
        run: npm publish --access public
